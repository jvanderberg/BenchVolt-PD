name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: Firmware/Rust/benchvolt-pd

jobs:
  firmware:
    name: Firmware build (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with ARM target and llvm-tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add thumbv6m-none-eabi
          rustup component add llvm-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/benchvolt-pd/target
          key: firmware-${{ runner.os }}-${{ hashFiles('Firmware/Rust/benchvolt-pd/Cargo.lock') }}
      - name: Build release firmware
        run: cargo build --release
      - name: Produce raw binary and check partition fit
        run: |
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy | head -1)
          "$OBJCOPY" -O binary \
            target/thumbv6m-none-eabi/release/benchvolt-pd \
            target/thumbv6m-none-eabi/release/benchvolt-pd.bin
          SIZE=$(stat -c%s target/thumbv6m-none-eabi/release/benchvolt-pd.bin)
          LIMIT=$((92 * 1024))
          echo "Firmware image: ${SIZE} bytes (partition limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Firmware exceeds the 92 KiB application partition"
            exit 1
          fi
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-firmware
          path: |
            Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd
            Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd.bin
          if-no-files-found: error

  c-firmware:
    name: C firmware build (bootloader + legacy app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build bootloader
        run: make -C Firmware/Bootloader -j"$(nproc)"
      - name: Build legacy C application
        run: make -C Firmware/USB_Power_Source -j"$(nproc)"
      - name: Check partition fit
        run: |
          BOOT=Firmware/Bootloader/build/bootloader.bin
          APP=Firmware/USB_Power_Source/build/usb_power_source.bin
          BOOT_SIZE=$(stat -c%s "$BOOT")
          APP_SIZE=$(stat -c%s "$APP")
          echo "Bootloader: ${BOOT_SIZE} bytes (limit 32768)"
          echo "Application: ${APP_SIZE} bytes (limit 98304)"
          if [ "$BOOT_SIZE" -gt 32768 ]; then
            echo "::error::Bootloader exceeds the 32 KiB bootloader partition"
            exit 1
          fi
          if [ "$APP_SIZE" -gt 98304 ]; then
            echo "::error::C application exceeds the 96 KiB application partition"
            exit 1
          fi
      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-c-bootloader
          path: Firmware/Bootloader/build/bootloader.bin
          if-no-files-found: error
      - name: Upload C application artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-c-firmware
          path: Firmware/USB_Power_Source/build/usb_power_source.bin
          if-no-files-found: error

  v2-boot-chain:
    name: v2 boot chain (migrator + cores + v2 app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with ARM target and ARM GCC (for objcopy)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add thumbv6m-none-eabi
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/boot-v2/target
          key: v2boot-${{ runner.os }}-${{ hashFiles('Firmware/Rust/boot-v2/Cargo.lock') }}
      - name: Host tests (boot decision logic)
        run: cargo test -p boot-shared --target x86_64-unknown-linux-gnu
        working-directory: Firmware/Rust/boot-v2
      - name: Build migrator (embeds trampoline + golden + worker)
        run: bash Firmware/Rust/boot-v2/tools/build_migrator.sh
      - name: Slot fit checks
        run: |
          check() {
            SIZE=$(stat -c%s "$1")
            echo "$1: ${SIZE} bytes (limit $2)"
            if [ "$SIZE" -gt "$2" ]; then
              echo "::error::$1 exceeds its $2-byte slot"
              exit 1
            fi
          }
          cd Firmware/Rust/boot-v2
          check crates/migrator/payload/trampoline.bin 2048
          check crates/migrator/payload/golden.bin 6144
          check crates/migrator/payload/worker.bin 12288
          check migrator.bin 94208
      - name: Build v2 application image (0x08005000 partition)
        run: BENCHVOLT_LAYOUT=v2 bash Firmware/Rust/benchvolt-pd/tools/build_image.sh
      - name: Collect artifacts
        run: |
          mkdir -p dist-v2
          cp Firmware/Rust/boot-v2/migrator.bin dist-v2/
          cp Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd.bin dist-v2/benchvolt-v2.bin
      - name: Upload v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-v2-boot-chain
          path: dist-v2/
          if-no-files-found: error

  release:
    name: Publish latest firmware
    runs-on: ubuntu-latest
    needs: [firmware, c-firmware, tests, v2-boot-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-c-bootloader
          path: dist/c
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-c-firmware
          path: dist/c
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-v2-boot-chain
          path: dist/v2
      - name: Update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN=$(find dist -name benchvolt-pd.bin | head -1)
          SIZE=$(stat -c%s "$BIN")
          NOTES="Rolling build of main at ${GITHUB_SHA}. Image size: ${SIZE} bytes (92 KiB partition). Flash from the desktop GUI's firmware update tab, or with Firmware/Rust/benchvolt-pd/tools/flash_firmware.py. To install on any device: start a smart update with benchvolt-v2.bin selected — the GUI handles a stock device automatically (it fetches migrator.bin when needed; keep it next to the firmware for offline use). See README 'Installing firmware on a stock device'."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$BIN#benchvolt-pd.bin (application image for the stock factory bootloader)" \
            "dist/v2/benchvolt-v2.bin#benchvolt-v2.bin (application image; the GUI installs the boot chain on stock devices automatically)" \
            "dist/v2/migrator.bin#migrator.bin (boot chain installer; only needed offline — the GUI downloads it on demand)" \
            "dist/c/bootloader.bin#bootloader.bin (flash once via ST-Link/DFU at 0x08000000)" \
            "dist/c/usb_power_source.bin#usb_power_source.bin (legacy C application, alternative to the Rust image; flash via bootloader at 0x08008000)" \
            --title "Latest firmware (main)" \
            --notes "$NOTES" \
            --latest \
            --target "$GITHUB_SHA"

  tests:
    name: Host tests (lib + integration + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/benchvolt-pd/target
          key: tests-${{ runner.os }}-${{ hashFiles('Firmware/Rust/benchvolt-pd/Cargo.lock') }}
      - name: Run test suite
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features

  lints:
    name: Formatting and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
      - name: rustfmt
        run: cargo fmt --check
        continue-on-error: true
      - name: clippy (host, warnings allowed to inform only)
        run: cargo clippy --target x86_64-unknown-linux-gnu --no-default-features
        continue-on-error: true
