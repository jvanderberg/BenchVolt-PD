name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: Firmware/Rust/benchvolt-pd

jobs:
  firmware:
    name: Firmware build (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with ARM target and llvm-tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add thumbv6m-none-eabi
          rustup component add llvm-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/benchvolt-pd/target
          key: firmware-${{ runner.os }}-${{ hashFiles('Firmware/Rust/benchvolt-pd/Cargo.lock') }}
      - name: Build release firmware
        run: cargo build --release
      - name: Produce raw binary and check partition fit
        run: |
          OBJCOPY=$(find "$(rustc --print sysroot)" -name llvm-objcopy | head -1)
          "$OBJCOPY" -O binary \
            target/thumbv6m-none-eabi/release/benchvolt-pd \
            target/thumbv6m-none-eabi/release/benchvolt-pd.bin
          SIZE=$(stat -c%s target/thumbv6m-none-eabi/release/benchvolt-pd.bin)
          LIMIT=$((92 * 1024))
          echo "Firmware image: ${SIZE} bytes (partition limit ${LIMIT})"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Firmware exceeds the 92 KiB application partition"
            exit 1
          fi
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-firmware
          path: |
            Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd
            Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd.bin
          if-no-files-found: error

  c-firmware:
    name: C firmware build (bootloader + legacy app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build bootloader
        run: make -C Firmware/Bootloader -j"$(nproc)"
      - name: Build legacy C application
        run: make -C Firmware/USB_Power_Source -j"$(nproc)"
      - name: Check partition fit
        run: |
          BOOT=Firmware/Bootloader/build/bootloader.bin
          APP=Firmware/USB_Power_Source/build/usb_power_source.bin
          BOOT_SIZE=$(stat -c%s "$BOOT")
          APP_SIZE=$(stat -c%s "$APP")
          echo "Bootloader: ${BOOT_SIZE} bytes (limit 32768)"
          echo "Application: ${APP_SIZE} bytes (limit 98304)"
          if [ "$BOOT_SIZE" -gt 32768 ]; then
            echo "::error::Bootloader exceeds the 32 KiB bootloader partition"
            exit 1
          fi
          if [ "$APP_SIZE" -gt 98304 ]; then
            echo "::error::C application exceeds the 96 KiB application partition"
            exit 1
          fi
      - name: Upload bootloader artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-c-bootloader
          path: Firmware/Bootloader/build/bootloader.bin
          if-no-files-found: error
      - name: Upload C application artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-c-firmware
          path: Firmware/USB_Power_Source/build/usb_power_source.bin
          if-no-files-found: error

  release:
    name: Publish latest firmware
    runs-on: ubuntu-latest
    needs: [firmware, c-firmware, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-c-bootloader
          path: dist/c
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-c-firmware
          path: dist/c
      - name: Update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BIN=$(find dist -name benchvolt-pd.bin | head -1)
          SIZE=$(stat -c%s "$BIN")
          NOTES="Rolling build of main at ${GITHUB_SHA}. Image size: ${SIZE} bytes (92 KiB partition). Flash from the desktop GUI's firmware update tab, or with Firmware/Rust/benchvolt-pd/tools/flash_firmware.py."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$BIN#benchvolt-pd.bin (application image, flash via GUI or flash_firmware.py)" \
            "dist/c/bootloader.bin#bootloader.bin (flash once via ST-Link/DFU at 0x08000000)" \
            "dist/c/usb_power_source.bin#usb_power_source.bin (legacy C application, alternative to the Rust image; flash via bootloader at 0x08008000)" \
            --title "Latest firmware (main)" \
            --notes "$NOTES" \
            --latest \
            --target "$GITHUB_SHA"

  tests:
    name: Host tests (lib + integration + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/benchvolt-pd/target
          key: tests-${{ runner.os }}-${{ hashFiles('Firmware/Rust/benchvolt-pd/Cargo.lock') }}
      - name: Run test suite
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features

  lints:
    name: Formatting and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
      - name: rustfmt
        run: cargo fmt --check
        continue-on-error: true
      - name: clippy (host, warnings allowed to inform only)
        run: cargo clippy --target x86_64-unknown-linux-gnu --no-default-features
        continue-on-error: true
