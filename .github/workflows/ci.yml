name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: Firmware/Rust/benchvolt-pd

jobs:
  v2-boot-chain:
    name: v2 boot chain (migrator + cores + v2 app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with ARM target and ARM GCC (for objcopy)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add thumbv6m-none-eabi
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/boot-v2/target
          key: v2boot-${{ runner.os }}-${{ hashFiles('Firmware/Rust/boot-v2/Cargo.lock') }}
      - name: Host tests (boot decision logic)
        run: cargo test -p boot-shared --target x86_64-unknown-linux-gnu
        working-directory: Firmware/Rust/boot-v2
      - name: Build migrator (embeds trampoline + golden + worker)
        run: bash Firmware/Rust/boot-v2/tools/build_migrator.sh
      - name: Slot fit checks
        run: |
          check() {
            SIZE=$(stat -c%s "$1")
            echo "$1: ${SIZE} bytes (limit $2)"
            if [ "$SIZE" -gt "$2" ]; then
              echo "::error::$1 exceeds its $2-byte slot"
              exit 1
            fi
          }
          cd Firmware/Rust/boot-v2
          check crates/migrator/payload/trampoline.bin 2048
          check crates/migrator/payload/golden.bin 6144
          check crates/migrator/payload/worker.bin 12288
          check migrator.bin 94208
      - name: Build v2 application image (0x08005000 partition)
        run: BENCHVOLT_LAYOUT=v2 bash Firmware/Rust/benchvolt-pd/tools/build_image.sh
      - name: Collect artifacts
        run: |
          mkdir -p dist-v2
          cp Firmware/Rust/boot-v2/migrator.bin dist-v2/
          cp Firmware/Rust/benchvolt-pd/target/thumbv6m-none-eabi/release/benchvolt-pd.bin dist-v2/benchvolt-v2.bin
      - name: Upload v2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchvolt-v2-boot-chain
          path: dist-v2/
          if-no-files-found: error

  release:
    name: Publish latest firmware
    runs-on: ubuntu-latest
    needs: [tests, v2-boot-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchvolt-v2-boot-chain
          path: dist/v2
      - name: Update rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s dist/v2/benchvolt-v2.bin)
          NOTES="Rolling build of main at ${GITHUB_SHA}. Image size: ${SIZE} bytes (104 KiB partition). To install on any device: start a smart update in the desktop GUI with benchvolt-v2.bin selected — a factory device gets the boot chain automatically (the GUI fetches migrator.bin when needed; keep it next to the firmware for offline use). See README 'Installing firmware on a stock device'."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "dist/v2/benchvolt-v2.bin#benchvolt-v2.bin (application image; the GUI installs the boot chain on stock devices automatically)" \
            "dist/v2/migrator.bin#migrator.bin (boot chain installer; only needed offline — the GUI downloads it on demand)" \
            --title "Latest firmware (main)" \
            --notes "$NOTES" \
            --latest \
            --target "$GITHUB_SHA"

  tests:
    name: Host tests (lib + integration + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Firmware/Rust/benchvolt-pd/target
          key: tests-${{ runner.os }}-${{ hashFiles('Firmware/Rust/benchvolt-pd/Cargo.lock') }}
      - name: Run test suite
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features

  lints:
    name: Formatting and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt
      - name: rustfmt
        run: cargo fmt --check
        continue-on-error: true
      - name: clippy (host, warnings allowed to inform only)
        run: cargo clippy --target x86_64-unknown-linux-gnu --no-default-features
        continue-on-error: true
